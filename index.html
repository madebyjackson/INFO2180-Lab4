<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avengers Character Search</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Avengers Character Search</h1>
  </header>

  <main>
    <form id="search-form">
      <label for="search-input">Search by Full Name or Alias</label>
      <div class="row">
        <input type="text" id="search-input" name="query"
               placeholder="e.g. Captain America or Steve Rogers">
        <button type="submit" id="search-btn">Search</button>
      </div>
    </form>

    <h2>Result</h2>
    <hr>
    <div id="result"></div>
  </main>
</body>
</html>
